name: Build Windows EXE

on:
  push:
    branches: [version_for_macos]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies (without ML group)
        run: poetry install --without ml --no-interaction --no-ansi

      - name: Build EXE with PyInstaller
        run: poetry run pyinstaller radiobiology_app.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadiobiologyAnalysis-windows
          path: dist/RadiobiologyAnalysis.exe
          retention-days: 30
