[tool.poetry]
name = "neuro-stats"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "neuro_stats"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
# Core dependencies for Radiobiology Analysis
numpy = "1.26.4"
pyqt6 = "^6.6.1"
fastdtw = "^0.3.4"
seaborn = "^0.13.2"
scipy = "1.11.4"
scikit-learn = "^1.3.0"
openpyxl = "^3.1.2"
matplotlib = "^3.7.0"
pandas = "^2.0.0"
protobuf = "5.29.3"
nibabel = "^5.3.2"
pydicom = "^3.0.1"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# Heavy ML libraries (not needed for Radiobiology Analysis)
torch = "^2.0.1"
opencv-python = "^4.8.0.74"
tensorboard = "^2.14.0"
torchsummaryx = "^1.3.0"
pymupdf = "^1.22.5"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
